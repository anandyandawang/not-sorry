name: demo

on:
  push:
    paths:
      - .github/workflows/demo.yml
      - demo/record.sh
      - app/**

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - run: gradle assembleDebug

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash demo/record.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo
          path: out

      - name: Push video to demo-video branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/demo-video
          rm -f out/recording
          cp -r out/. /tmp/demo-video/
          cd /tmp/demo-video
          git init -b demo-video
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "demo video"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-video
