name: demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - run: gradle assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -x
            mkdir -p out/frames
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure enabled_accessibility_services com.notsorry/com.notsorry.ReplaceService
            adb shell settings put secure accessibility_enabled 1
            sleep 3
            adb shell settings get secure enabled_accessibility_services | tee out/services.txt
            adb shell am start -a android.intent.action.INSERT -t vnd.android.cursor.dir/contact
            sleep 6
            dump() { adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb pull /sdcard/ui.xml "$1" >/dev/null; }
            center() { python3 - "$1" "$2" <<'PY'
            import re, sys
            xml = open(sys.argv[1]).read()
            for node in re.findall(r'<node [^>]*>', xml):
                if re.search(sys.argv[2], node):
                    b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
                    x1, y1, x2, y2 = map(int, b.groups())
                    print((x1 + x2) // 2, (y1 + y2) // 2)
                    break
            PY
            }
            dump out/ui1.xml
            btn=$(center out/ui1.xml 'class="android.widget.Button"[^>]*text="(?i)(keep|ok|skip|no thanks|got it|cancel)[^"]*"')
            if [ -n "$btn" ]; then adb shell input tap $btn; sleep 2; dump out/ui2.xml; fi
            field=$(center out/ui2.xml 'class="android.widget.EditText"' 2>/dev/null || true)
            [ -n "$field" ] || field=$(center out/ui1.xml 'class="android.widget.EditText"')
            adb shell input tap $field
            sleep 1
            touch out/recording
            (i=0; while [ -f out/recording ]; do adb exec-out screencap -p > out/frames/f$(printf %04d $i).png; i=$((i+1)); done) &
            rec=$!
            sleep 2
            adb shell input text "I%sam%sso%ssorry"
            sleep 1
            adb shell input keyevent 62
            sleep 2
            adb shell input text "Sorry"
            sleep 1
            adb shell input keyevent 55
            sleep 2
            adb shell input keyevent 62
            adb shell input text "SORRY"
            sleep 1
            adb shell input keyevent 56
            sleep 3
            rm out/recording
            wait $rec
            dump out/ui_final.xml
            ffmpeg -y -framerate 3 -i out/frames/f%04d.png -vf "scale=trunc(iw/4)*2:trunc(ih/4)*2" -c:v libx264 -pix_fmt yuv420p out/demo.mp4
            python3 - <<'PY'
            import re
            xml = open("out/ui_final.xml").read()
            texts = re.findall(r'class="android.widget.EditText"[^>]*text="([^"]*)"', xml) + re.findall(r'text="([^"]*)"[^>]*class="android.widget.EditText"', xml)
            print(texts)
            assert any("so " in t and "sorry" not in t.lower() for t in texts), texts
            PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo
          path: out

      - name: Push video to demo-video branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/demo-video
          cp out/demo.mp4 out/*.xml out/*.txt /tmp/demo-video/ || true
          cd /tmp/demo-video
          git init -b demo-video
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "demo video"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-video
